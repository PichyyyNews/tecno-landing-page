<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Map - Thailand Lopburi Core</title>
<!-- Local amCharts 5 libraries -->
<script src="/amcharts/index.js"></script>
<script src="/amcharts/map.js"></script>
<script src="/amcharts/Animated.js"></script>
<script src="/amcharts/Dark.js"></script>
<script src="/amcharts/thailandLow.js"></script>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #09090b !important;
    background: #09090b !important;
    color: #f4f4f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #chartdiv {
    width: 100%;
    height: 100%;
    background-color: #09090b !important;
    background: #09090b !important;
    position: relative;
    cursor: grab;
  }
  #chartdiv:active {
    cursor: grabbing;
  }
  /* Inward soft dark edge vignette so dots fade gracefully into #09090b */
  .edge-vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse 90% 85% at 50% 50%, transparent 55%, #09090b 100%);
    z-index: 10;
  }
  /* Hide amcharts logo */
  a[title*="JavaScript charts"], a[href*="amcharts"] {
    display: none !important;
    opacity: 0 !important;
    visibility: hidden !important;
  }
</style>
</head>
<body>

<div id="chartdiv"></div>
<div class="edge-vignette"></div>

<script>
am5.ready(function() {
  var root = am5.Root.new("chartdiv");

  // Remove watermark if accessible
  if (root._logo) {
    root._logo.dispose();
  }

  root.setThemes([am5themes_Animated.new(root), am5themes_Dark.new(root)]);

  // Pannable & Draggable Map centered on Thailand & Lopburi
  var chart = root.container.children.push(am5map.MapChart.new(root, {
    projection: am5map.geoMercator(),
    panX: "translateX",
    panY: "translateY",
    wheelY: "zoom",
    wheelSensitivity: 0.6,
    maxPanOut: 0.5,
    minZoomLevel: 1.0,
    maxZoomLevel: 6.0,
    homeZoomLevel: 1.6,
    homeGeoPoint: { longitude: 100.8, latitude: 14.5 },
    homeRotationX: 0,
    homeRotationY: 0
  }));

  chart.chartContainer.set("background", am5.Rectangle.new(root, {
    fill: am5.color(0x09090b),
    fillOpacity: 1
  }));

  // Pixel Map Series of Thailand
  var series = chart.series.push(am5map.PixelMapSeries.new(root, {
    geoJSON: am5geodata_thailandLow,
    pixelType: "circle",
    step: 0.125,
    pixelSize: 0.78,
    equalArea: false
  }));

  // Polygon styling - subtle neutral zinc dot matrix
  series.mapPolygons.template.setAll({
    fill: am5.color(0x3f3f46),
    fillOpacity: 0.8,
    tooltipText: "{name}",
    templateField: "polygonSettings",
    interactive: true
  });

  // Hover state - subtle light zinc highlight
  series.mapPolygons.template.states.create("hover", {
    fill: am5.color(0xd4d4d8),
    fillOpacity: 1
  });

  // Focus on Lopburi (TH-16) with signature Sunrise Orange
  series.data.setAll([
    {
      id: "TH-16",
      polygonSettings: {
        fill: am5.color(0xfd5714),
        fillOpacity: 1
      }
    }
  ]);

  // Point Series for Glowing Radar Beacon at Lopburi centroid
  var pointSeries = chart.series.push(am5map.MapPointSeries.new(root, {}));
  
  pointSeries.bullets.push(function() {
    var container = am5.Container.new(root, {});

    // Radar pulse wave
    var circlePulse = container.children.push(am5.Circle.new(root, {
      radius: 8,
      fill: am5.color(0xfd5714),
      fillOpacity: 0.35,
      stroke: am5.color(0xfd5714),
      strokeWidth: 1.5,
      strokeOpacity: 0.7
    }));

    circlePulse.animate({
      key: "radius",
      to: 28,
      duration: 1800,
      loops: Infinity,
      easing: am5.ease.out(am5.ease.cubic)
    });

    circlePulse.animate({
      key: "opacity",
      from: 0.7,
      to: 0,
      duration: 1800,
      loops: Infinity,
      easing: am5.ease.out(am5.ease.cubic)
    });

    // Solid core dot
    container.children.push(am5.Circle.new(root, {
      radius: 4.5,
      fill: am5.color(0xffffff),
      stroke: am5.color(0xfd5714),
      strokeWidth: 2,
      tooltipText: "Lopburi Core Node (TH-16)"
    }));

    return am5.Bullet.new(root, {
      sprite: container
    });
  });

  // Lopburi coordinates
  pointSeries.data.setAll([
    {
      geometry: { type: "Point", coordinates: [100.6534, 14.7995] },
      title: "Lopburi Core"
    }
  ]);

  series.events.once("datavalidated", function() {
    chart.goHome(0);
  });

  chart.appear(1000, 100);
});
</script>
</body>
</html>
